<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Ofrenda — demo</title>
  <style>
    body { margin: 0; padding: 24px 16px 64px; background: #f4ead8; font-family: system-ui, sans-serif; color: #2a1640; }
    h1, h2 { font-family: Georgia, serif; font-weight: normal; text-align: center; }
    p.lead { max-width: 560px; margin: 0 auto 24px; text-align: center; }
    section { max-width: 760px; margin: 0 auto 48px; }
  </style>
</head>
<body>
  <h1>Digital Ofrenda</h1>
  <p class="lead">Phase 1 prototype. Edit the altar below, then reload: your changes are saved in this browser. The second altar shows how a visitor sees the same page.</p>

  <section>
    <h2>Edit mode</h2>
    <digital-ofrenda id="demo" mode="edit"></digital-ofrenda>
  </section>

  <section>
    <h2>View mode (what visitors see)</h2>
    <digital-ofrenda id="demo" mode="view"></digital-ofrenda>
  </section>

  <script src="ofrenda.js"></script>
  <script>
    // Both altars share the id "demo"; keep the view copy in sync when the editor saves.
    const [editor, viewer] = document.querySelectorAll('digital-ofrenda');
    editor.addEventListener('ofrenda-change', () => viewer.importState(editor.exportState()));
  </script>
</body>
</html>
