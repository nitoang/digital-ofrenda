name = "digital-ofrenda-api"
main = "worker.mjs"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "digital-ofrenda"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"   # npx wrangler d1 migrations apply digital-ofrenda

# Where photos are kept (server/photos.mjs). Optional: without it photos stay inline in D1, which holds a whole ofrenda
# to about five photos. Create it with:  npx wrangler r2 bucket create digital-ofrenda-photos
# Ofrendas saved before this was bound are moved over by the daily job, a few a day.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "digital-ofrenda-photos"

# A Worker you write for your email provider: it accepts POST /send with { to, subject, text }.
[[services]]
binding = "MAILER"
service = "digital-ofrenda-mailer"

# Put the website (site/, on Cloudflare Pages) and this Worker on one hostname. Route these paths to the Worker
# and let Pages serve everything else. One [[routes]] entry per pattern, for example:
#   [[routes]]
#   pattern = "ofrenda.example.com/auth/*"
#   zone_name = "example.com"
# Patterns: /auth/*   /me   /me/*   /checkout   /ofrendas   /ofrendas/*   /invites/*   /successor/*   /stripe/*   /resend/*   /s/*   /healthz
# ("/successor" with nothing after it is a web page, not part of the API.)

# The daily job: successor notices and reminders, and handovers waiting for someone to sign up (server/scheduled.mjs).
# Once a day is plenty; the minute is deliberately not :00.
[triggers]
crons = ["17 14 * * *"]

# Keep the Worker's logs (Workers Logs) so a failed request or daily job can be looked into afterwards.
[observability]
enabled = true

[vars]
# Serve your page and this Worker from this same origin: sign-in is a cookie and there is no CORS.
APP_URL = "https://REPLACE-WITH-YOUR-SITE"
# Every new account starts with one basic ofrenda called "My Ofrenda" (it counts toward the free limit). Remove to turn off.
STARTER_OFRENDA = "1"
# Create three one-time Prices in the Stripe dashboard and put their ids here:
# STRIPE_PRICE_EXTRA_PHOTOS = "price_..."
# STRIPE_PRICE_SEVEN_TIERS = "price_..."
# STRIPE_PRICE_PLATINUM = "price_..."
# Where problems are emailed (unhandled errors, failed mail, a failed daily job, a payment that unlocked nothing):
# ALERT_EMAIL = "you@example.com"
# A dead man's switch the daily job pings after a clean run (and <url>/fail after a bad one), for example a
# healthchecks.io check. https only. Point an uptime monitor at GET /healthz as well.
# HEARTBEAT_URL = "https://hc-ping.com/your-check-id"
# TURNSTILE_DISABLED = "1"                      # local development ONLY; never in production

# Secrets (never commit them):
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put RESEND_WEBHOOK_SECRET      # whsec_... from Resend > Webhooks (bounces and spam complaints)
#
# Also add Cloudflare rate-limiting rules (dashboard: Security > WAF > Rate limiting rules) for
# POST /auth/start, /auth/code, /auth/redeem and /checkout.
