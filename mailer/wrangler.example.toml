name = "digital-ofrenda-mailer"   # must match the service name in server/wrangler.example.toml
main = "worker.mjs"
compatibility_date = "2025-01-01"
workers_dev = false               # no public address: only the API Worker can call it

[vars]
MAIL_FROM = "digital-ofrenda <hello@REPLACE-WITH-YOUR-VERIFIED-DOMAIN>"
