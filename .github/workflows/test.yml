name: Tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'   # weekly, so a new advisory shows up even when nobody is pushing
permissions:
  contents: read
jobs:
  # The Worker, validator, mailer and typo tests: no browser, so once is enough.
  test:
    if: github.event_name != 'schedule'   # the weekly run is only for the audit below
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # node:sqlite, used by the Worker tests
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit

  # The component and the whole website, in each browser engine people use (Chrome/Edge/Opera, Firefox, and
  # Safari, which is WebKit). The two real-touch tests need Chrome's DevTools Protocol and run in Chromium only.
  browser:
    name: browser (${{ matrix.browser }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung browser should fail the job, not sit for hours
    strategy:
      fail-fast: false   # one engine failing should not hide what the others say
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser

  # Known vulnerabilities in what is installed. Fails on anything moderate or worse, in the production and the
  # development dependencies alike (Playwright is dev-only, but it runs on the machine of everyone who runs the tests).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate
